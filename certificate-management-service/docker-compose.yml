services:
  db:
    image: postgres:17-alpine
    container_name: cert-mgmt-db
    restart: always
    environment:
      POSTGRES_DB: certificate_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: