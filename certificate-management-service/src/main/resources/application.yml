spring:
  application:
    name: certificate-management-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  flyway:
    schemas: public,pki

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certificate_db}?currentSchema=public,pki
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_STRATEGY:update}
    show-sql: ${DB_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  modulith:
    events:
      republish-outstanding-events-on-restart: off
      jdbc:
        schema-initialization:
          enabled: true

springdoc:
  api-docs:
    enabled: ${SPRING_DOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRING_DOC_SWAGGER_UI_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

pki:
  ca:
    dir: ${PKI_CA_DIR:./keys/ca}
    private-key-file: ${PKI_CA_KEY_FILE:private.pem}
    certificate-file: ${PKI_CA_CERT_FILE:chain.pem}
    issuer-dn: ${PKI_CA_ISSUER_DN:CN=Central Bank of Somalia Root CA, O=Central Bank of Somalia, C=SO}
    validity-years: ${PKI_CA_VALIDITY_YEARS:10}

application:
  events:
    retry:
      max-attempts: ${EVENTS_RETRY_MAX_ATTEMPTS:5}
      delay: ${EVENTS_RETRY_DELAY:PT60S}