# Active Profile
SPRING_PROFILES_ACTIVE: prod

# Server Port
SERVER_PORT: ${SERVER_PORT:8081}

# springdoc (disabled in prod)
SPRING_DOC_API_DOCS_ENABLED: false
SPRING_DOC_SWAGGER_UI_ENABLED: false

# CORS Configuration
CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}

# Certificate Configuration (POSIX enterprise directory)
CERTS_DIR: ${CERTS_DIR:/etc/adapter/certs}
CA_CERT_FILE: ${CA_CERT_FILE:chain.pem}
BANK_CERT_FILE: ${BANK_CERT_FILE:certificate.pem}
PRIVATE_KEY_FILE: ${PRIVATE_KEY_FILE:private.pem}
STRICT_STARTUP_CHECK: ${STRICT_STARTUP_CHECK:true}