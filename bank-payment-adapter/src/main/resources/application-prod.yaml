# Production Profile Configuration
server:
  port: ${PORT:8081}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

adapter:
  bank-bic: ${BANK_BIC:PMRBSOMM}
  certs:
    dir: ${CERTS_DIR:/etc/adapter/certs}
    ca-cert-file: ${CA_CERT_FILE:chain.pem}
    bank-cert-file: ${BANK_CERT_FILE:certificate.pem}
    private-key-file: ${PRIVATE_KEY_FILE:private.pem}
    private-key-passphrase: ${PRIVATE_KEY_PASSPHRASE:}
    strict-startup-check: ${STRICT_STARTUP_CHECK:true}
  signature:
    algorithm: ${SIGNATURE_ALGORITHM:SHA256withRSA}
    canonicalization: ${CANONICALIZATION_ALGORITHM:EXCLUSIVE}
    xades-enabled: ${XADES_ENABLED:true}
    xades-namespace: ${XADES_NAMESPACE:http://uri.etsi.org/01903/v1.3.2#}