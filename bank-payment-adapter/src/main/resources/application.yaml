server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: bank-payment-adapter
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

springdoc:
  api-docs:
    enabled: ${SPRING_DOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRING_DOC_SWAGGER_UI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Bank Payment Adapter Service
    version: 1.0.0
    environment: ${SPRING_PROFILES_ACTIVE:dev}

adapter:
  bank-bic: ${BANK_BIC:PMRBSOMM}
  certs:
    dir: ${CERTS_DIR:./certs}
    ca-cert-file: ${CA_CERT_FILE:chain.pem}
    bank-cert-file: ${BANK_CERT_FILE:certificate.pem}
    private-key-file: ${PRIVATE_KEY_FILE:private.pem}
    private-key-passphrase: ${PRIVATE_KEY_PASSPHRASE:}
    strict-startup-check: ${STRICT_STARTUP_CHECK:true}
  signature:
    algorithm: ${SIGNATURE_ALGORITHM:SHA256withRSA}
    canonicalization: ${CANONICALIZATION_ALGORITHM:EXCLUSIVE}
    xades-enabled: ${XADES_ENABLED:true}
    xades-namespace: ${XADES_NAMESPACE:http://uri.etsi.org/01903/v1.3.2#}
